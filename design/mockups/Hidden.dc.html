<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BearMinVLC – Controls hidden</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
a{color:#EDEBE7}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="position: relative; height: 100vh; min-height: 560px; overflow: hidden; background: #000; color: #EDEBE7; font-family: 'Geist', system-ui, sans-serif">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, #0E131D 0%, #172030 55%, #241C17 100%)">
    <div style="position: absolute; left: 12%; top: 58%; width: 90px; height: 90px; border-radius: 50%; background: rgba(245,165,36,0.35); filter: blur(14px)"></div>
    <div style="position: absolute; left: 22%; top: 63%; width: 46px; height: 46px; border-radius: 50%; background: rgba(255,214,150,0.5); filter: blur(6px)"></div>
    <div style="position: absolute; left: 38%; top: 54%; width: 130px; height: 130px; border-radius: 50%; background: rgba(255,90,60,0.22); filter: blur(22px)"></div>
    <div style="position: absolute; left: 55%; top: 61%; width: 34px; height: 34px; border-radius: 50%; background: rgba(255,240,220,0.55); filter: blur(4px)"></div>
    <div style="position: absolute; left: 63%; top: 52%; width: 70px; height: 70px; border-radius: 50%; background: rgba(245,165,36,0.3); filter: blur(10px)"></div>
    <div style="position: absolute; left: 78%; top: 59%; width: 110px; height: 110px; border-radius: 50%; background: rgba(120,170,255,0.18); filter: blur(18px)"></div>
    <div style="position: absolute; left: 87%; top: 57%; width: 28px; height: 28px; border-radius: 50%; background: rgba(255,230,200,0.5); filter: blur(3px)"></div>
    <div style="position: absolute; left: 0; right: 0; top: 70%; height: 1px; background: rgba(255,255,255,0.06)"></div>
  </div>

  <div role="status" style="position: absolute; top: 28px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.08); background: rgba(26,25,23,0.92); box-shadow: 0 8px 24px rgba(0,0,0,0.35)">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg>
    <span aria-hidden="true" style="position: relative; width: 120px; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.28)"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 70%; border-radius: 999px; background: #EDEBE7"></span></span>
    <span style="min-width: 36px; text-align: right; font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums">Volume 70%</span>
  </div>

  <sc-if value="{{showLine}}" hint-placeholder-val="{{ true }}">
    <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 24px; background: linear-gradient(to top, rgba(0,0,0,0.45), rgba(0,0,0,0))"></div>
    <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,0.28)">
      <div style="height: 100%; width: 31%; background: {{accent}}"></div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5A524","options":["#F5A524","#FF7A1A","#7DD3FC","#EDEBE7"]},"showLine":{"editor":"boolean","default":true},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#F5A524',
      showLine: this.props.showLine ?? true
    };
  }
}
</script>
</body>
</html>
