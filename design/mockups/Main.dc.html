<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BearMinVLC – Start</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0C0B0A}
a{color:#EDEBE7}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="height: 100vh; min-height: 600px; box-sizing: border-box; display: flex; flex-direction: column; background: #0C0B0A; color: #EDEBE7; font-family: 'Geist', system-ui, sans-serif">
  <header style="height: 32px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding-left: 20px">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="18" height="18" viewBox="0 0 32 32" aria-hidden="true"><path fill="{{accent}}" d="M16 8C17.27 8 18.43 8.07 19.51 8.2A4.5 4.5 0 1 1 27.13 11.73C28.39 13.31 29 15.39 29 18C29 24.8 24.84 28 16 28C7.16 28 3 24.8 3 18C3 15.39 3.61 13.31 4.87 11.73A4.5 4.5 0 1 1 12.49 8.2C13.57 8.07 14.73 8 16 8Z"></path><path fill="#0C0B0A" d="M13.49 12.34L21.96 17.13A1 1 0 0 1 21.96 18.87L13.49 23.66A1 1 0 0 1 12 22.79L12 13.21A1 1 0 0 1 13.49 12.34Z"></path></svg>
      <span style="font-size: 12px; font-weight: 500; color: #A8A29E">BearMinVLC</span>
    </div>
    <div style="display: flex">
      <button aria-label="Minimize" style="width: 46px; height: 32px; border: 0; border-radius: 0; background: transparent; color: #A8A29E; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M0 5.5h10"></path></svg></button>
      <button aria-label="Maximize" style="width: 46px; height: 32px; border: 0; border-radius: 0; background: transparent; color: #A8A29E; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><rect x="0.5" y="0.5" width="9" height="9" rx="1"></rect></svg></button>
      <button aria-label="Close" style="width: 46px; height: 32px; border: 0; border-radius: 0; background: transparent; color: #A8A29E; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M0.5 0.5l9 9M9.5 0.5l-9 9"></path></svg></button>
    </div>
  </header>

  <main style="flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 48px; padding: 16px 20px">
    <section style="display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 560px; text-align: center">
      <svg width="56" height="56" viewBox="0 0 32 32" aria-hidden="true"><path fill="{{accent}}" d="M16 8C17.27 8 18.43 8.07 19.51 8.2A4.5 4.5 0 1 1 27.13 11.73C28.39 13.31 29 15.39 29 18C29 24.8 24.84 28 16 28C7.16 28 3 24.8 3 18C3 15.39 3.61 13.31 4.87 11.73A4.5 4.5 0 1 1 12.49 8.2C13.57 8.07 14.73 8 16 8Z"></path><path fill="#0C0B0A" d="M13.49 12.34L21.96 17.13A1 1 0 0 1 21.96 18.87L13.49 23.66A1 1 0 0 1 12 22.79L12 13.21A1 1 0 0 1 13.49 12.34Z"></path></svg>
      <h1 style="margin: 6px 0 0; font-size: 28px; font-weight: 600; letter-spacing: -0.02em">Drop a video here</h1>
      <p style="margin: 0; max-width: 380px; font-size: 15px; line-height: 1.5; color: #A8A29E">Or open one from your computer. MKV, MP4, AVI, MOV, WebM — just about anything plays.</p>
      <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 10px">
        <button style="height: 44px; padding: 0 22px; border: 0; border-radius: 999px; background: {{accent}}; color: #0C0B0A; font-family: inherit; font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 10px">Open file <span style="font-size: 12px; opacity: 0.7">Ctrl O</span></button>
        <button style="height: 44px; padding: 0 20px; border: 1px solid rgba(255,255,255,0.14); border-radius: 999px; background: transparent; color: #EDEBE7; font-family: inherit; font-size: 15px; font-weight: 500">Open URL</button>
      </div>
    </section>

    <section aria-labelledby="recent-h" style="width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 2px">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 0 6px 8px">
        <h2 id="recent-h" style="margin: 0; font-size: 12px; font-weight: 500; color: #A8A29E">Recent</h2>
        <button style="height: 28px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; color: #A8A29E; font-family: inherit; font-size: 12px">Clear</button>
      </div>
      <button style="display: flex; align-items: center; gap: 14px; width: 100%; min-height: 52px; padding: 8px; border: 0; border-radius: 14px; background: transparent; color: #EDEBE7; font-family: inherit; text-align: left">
        <span aria-hidden="true" style="width: 64px; height: 36px; flex-shrink: 0; border-radius: 6px; background: #1A2232"></span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 14px; font-weight: 500">Night drive.mp4</span>
          <span style="font-size: 12px; color: #A8A29E; font-variant-numeric: tabular-nums">Resume at 12:48 · 44:10</span>
        </span>
        <span aria-hidden="true" style="width: 56px; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.14); overflow: hidden"><span style="display: block; width: 29%; height: 100%; background: {{accent}}"></span></span>
      </button>
      <button style="display: flex; align-items: center; gap: 14px; width: 100%; min-height: 52px; padding: 8px; border: 0; border-radius: 14px; background: transparent; color: #EDEBE7; font-family: inherit; text-align: left">
        <span aria-hidden="true" style="width: 64px; height: 36px; flex-shrink: 0; border-radius: 6px; background: #2A2620"></span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 14px; font-weight: 500">Lecture 04 – Thermodynamics.mkv</span>
          <span style="font-size: 12px; color: #A8A29E; font-variant-numeric: tabular-nums">Resume at 51:02 · 1:18:40</span>
        </span>
        <span aria-hidden="true" style="width: 56px; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.14); overflow: hidden"><span style="display: block; width: 65%; height: 100%; background: {{accent}}"></span></span>
      </button>
      <button style="display: flex; align-items: center; gap: 14px; width: 100%; min-height: 52px; padding: 8px; border: 0; border-radius: 14px; background: transparent; color: #EDEBE7; font-family: inherit; text-align: left">
        <span aria-hidden="true" style="width: 64px; height: 36px; flex-shrink: 0; border-radius: 6px; background: #1F2B2A"></span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 14px; font-weight: 500">Beach day.mov</span>
          <span style="font-size: 12px; color: #A8A29E; font-variant-numeric: tabular-nums">Watched · 6:32</span>
        </span>
        <span aria-hidden="true" style="width: 56px; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.14); overflow: hidden"><span style="display: block; width: 100%; height: 100%; background: rgba(255,255,255,0.35)"></span></span>
      </button>
      <button style="display: flex; align-items: center; gap: 14px; width: 100%; min-height: 52px; padding: 8px; border: 0; border-radius: 14px; background: transparent; color: #A8A29E; font-family: inherit; text-align: left">
        <span aria-hidden="true" style="width: 64px; height: 36px; flex-shrink: 0; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); box-sizing: border-box; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5M10 12.5l4 4M14 12.5l-4 4"></path></svg></span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 14px; font-weight: 500">Old clip.mkv</span>
          <span style="font-size: 12px">File not found — right-click to locate or remove</span>
        </span>
      </button>
    </section>
  </main>

  <footer style="flex-shrink: 0; display: flex; justify-content: center; padding: 12px 20px 20px; font-size: 12px; color: #A8A29E">
    <span style="display: flex; align-items: center; gap: 6px">Press <kbd style="font-family: 'Geist Mono', monospace; font-size: 11px; padding: 2px 6px; border: 1px solid rgba(255,255,255,0.14); border-radius: 6px; color: #EDEBE7">?</kbd> for keyboard shortcuts</span>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5A524","options":["#F5A524","#FF7A1A","#7DD3FC","#EDEBE7"]},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#F5A524' };
  }
}
</script>
</body>
</html>
