<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BearMinVLC – Open URL</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0C0B0A}
a{color:#EDEBE7}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="position: relative; height: 100vh; min-height: 560px; overflow: hidden; background: #0C0B0A; color: #EDEBE7; font-family: 'Geist', system-ui, sans-serif">
  <header style="position: relative; height: 32px; display: flex; align-items: center; justify-content: space-between; padding-left: 20px">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="18" height="18" viewBox="0 0 32 32" aria-hidden="true"><path fill="{{accent}}" d="M16 8C17.27 8 18.43 8.07 19.51 8.2A4.5 4.5 0 1 1 27.13 11.73C28.39 13.31 29 15.39 29 18C29 24.8 24.84 28 16 28C7.16 28 3 24.8 3 18C3 15.39 3.61 13.31 4.87 11.73A4.5 4.5 0 1 1 12.49 8.2C13.57 8.07 14.73 8 16 8Z"></path><path fill="#0C0B0A" d="M13.49 12.34L21.96 17.13A1 1 0 0 1 21.96 18.87L13.49 23.66A1 1 0 0 1 12 22.79L12 13.21A1 1 0 0 1 13.49 12.34Z"></path></svg>
      <span style="font-size: 12px; font-weight: 500; color: #A8A29E">BearMinVLC</span>
    </div>
    <div style="display: flex">
      <button aria-label="Minimize" style="width: 46px; height: 32px; border: 0; border-radius: 0; background: transparent; color: #A8A29E; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M0 5.5h10"></path></svg></button>
      <button aria-label="Maximize" style="width: 46px; height: 32px; border: 0; border-radius: 0; background: transparent; color: #A8A29E; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><rect x="0.5" y="0.5" width="9" height="9" rx="1"></rect></svg></button>
      <button aria-label="Close" style="width: 46px; height: 32px; border: 0; border-radius: 0; background: transparent; color: #A8A29E; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M0.5 0.5l9 9M9.5 0.5l-9 9"></path></svg></button>
    </div>
  </header>

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 32px; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; opacity: 0.35">
    <svg width="56" height="56" viewBox="0 0 32 32"><path fill="{{accent}}" d="M16 8C17.27 8 18.43 8.07 19.51 8.2A4.5 4.5 0 1 1 27.13 11.73C28.39 13.31 29 15.39 29 18C29 24.8 24.84 28 16 28C7.16 28 3 24.8 3 18C3 15.39 3.61 13.31 4.87 11.73A4.5 4.5 0 1 1 12.49 8.2C13.57 8.07 14.73 8 16 8Z"></path><path fill="#0C0B0A" d="M13.49 12.34L21.96 17.13A1 1 0 0 1 21.96 18.87L13.49 23.66A1 1 0 0 1 12 22.79L12 13.21A1 1 0 0 1 13.49 12.34Z"></path></svg>
    <div style="font-size: 28px; font-weight: 600; letter-spacing: -0.02em">Drop a video here</div>
  </div>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 32px; bottom: 0; background: rgba(0,0,0,0.55)"></div>

  <div style="position: absolute; left: 0; right: 0; top: 32px; bottom: 0; display: flex; align-items: center; justify-content: center; padding: 20px">
    <section role="dialog" aria-labelledby="url-h" style="width: 100%; max-width: 480px; box-sizing: border-box; padding: 24px; border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; background: #1A1917; box-shadow: 0 24px 60px rgba(0,0,0,0.55); display: flex; flex-direction: column; gap: 16px">
      <h2 id="url-h" style="margin: 0; font-size: 15px; font-weight: 500">Open URL</h2>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="url-in" style="font-size: 12px; font-weight: 500; color: #A8A29E">Stream or video address</label>
        <input id="url-in" type="url" value="https://example.com/live/stream.m3u8" style="height: 44px; box-sizing: border-box; padding: 0 14px; border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; background: #0C0B0A; color: #EDEBE7; font-family: inherit; font-size: 14px; outline: 2px solid rgba(245,165,36,0.6); outline-offset: 1px">
        <span style="font-size: 12px; color: #A8A29E">Pasted from your clipboard. HTTP, HLS, RTSP and most other streams work.</span>
      </div>
      <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px">
        <button style="height: 40px; padding: 0 18px; border: 1px solid rgba(255,255,255,0.14); border-radius: 999px; background: transparent; color: #EDEBE7; font-family: inherit; font-size: 14px; font-weight: 500">Cancel</button>
        <button style="height: 40px; padding: 0 20px; border: 0; border-radius: 999px; background: {{accent}}; color: #0C0B0A; font-family: inherit; font-size: 14px; font-weight: 500">Open</button>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5A524","options":["#F5A524","#FF7A1A","#7DD3FC","#EDEBE7"]},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#F5A524' };
  }
}
</script>
</body>
</html>
