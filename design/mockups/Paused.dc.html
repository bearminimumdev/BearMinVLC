<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BearMinVLC – Paused with right-click menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
a{color:#EDEBE7}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="position: relative; height: 100vh; min-height: 560px; overflow: hidden; background: #000; color: #EDEBE7; font-family: 'Geist', system-ui, sans-serif">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, #0E131D 0%, #172030 55%, #241C17 100%)">
    <div style="position: absolute; left: 12%; top: 58%; width: 90px; height: 90px; border-radius: 50%; background: rgba(245,165,36,0.35); filter: blur(14px)"></div>
    <div style="position: absolute; left: 22%; top: 63%; width: 46px; height: 46px; border-radius: 50%; background: rgba(255,214,150,0.5); filter: blur(6px)"></div>
    <div style="position: absolute; left: 38%; top: 54%; width: 130px; height: 130px; border-radius: 50%; background: rgba(255,90,60,0.22); filter: blur(22px)"></div>
    <div style="position: absolute; left: 55%; top: 61%; width: 34px; height: 34px; border-radius: 50%; background: rgba(255,240,220,0.55); filter: blur(4px)"></div>
    <div style="position: absolute; left: 63%; top: 52%; width: 70px; height: 70px; border-radius: 50%; background: rgba(245,165,36,0.3); filter: blur(10px)"></div>
    <div style="position: absolute; left: 78%; top: 59%; width: 110px; height: 110px; border-radius: 50%; background: rgba(120,170,255,0.18); filter: blur(18px)"></div>
    <div style="position: absolute; left: 87%; top: 57%; width: 28px; height: 28px; border-radius: 50%; background: rgba(255,230,200,0.5); filter: blur(3px)"></div>
    <div style="position: absolute; left: 0; right: 0; top: 70%; height: 1px; background: rgba(255,255,255,0.06)"></div>
  </div>

  <header style="position: absolute; top: 0; left: 0; right: 0; height: 96px; display: flex; align-items: flex-start; justify-content: space-between; padding-left: 20px; background: linear-gradient(to bottom, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.6) 35%, rgba(0,0,0,0) 100%)">
    <div style="display: flex; align-items: center; gap: 10px; height: 32px">
      <svg width="18" height="18" viewBox="0 0 32 32" aria-hidden="true"><path fill="{{accent}}" d="M16 8C17.27 8 18.43 8.07 19.51 8.2A4.5 4.5 0 1 1 27.13 11.73C28.39 13.31 29 15.39 29 18C29 24.8 24.84 28 16 28C7.16 28 3 24.8 3 18C3 15.39 3.61 13.31 4.87 11.73A4.5 4.5 0 1 1 12.49 8.2C13.57 8.07 14.73 8 16 8Z"></path><path fill="#0C0B0A" d="M13.49 12.34L21.96 17.13A1 1 0 0 1 21.96 18.87L13.49 23.66A1 1 0 0 1 12 22.79L12 13.21A1 1 0 0 1 13.49 12.34Z"></path></svg>
      <span style="font-size: 14px; font-weight: 500">Night drive.mp4</span>
    </div>
    <div style="display: flex">
      <button aria-label="Minimize" style="width: 46px; height: 32px; border: 0; border-radius: 0; background: transparent; color: #EDEBE7; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M0 5.5h10"></path></svg></button>
      <button aria-label="Maximize" style="width: 46px; height: 32px; border: 0; border-radius: 0; background: transparent; color: #EDEBE7; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><rect x="0.5" y="0.5" width="9" height="9" rx="1"></rect></svg></button>
      <button aria-label="Close" style="width: 46px; height: 32px; border: 0; border-radius: 0; background: transparent; color: #EDEBE7; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M0.5 0.5l9 9M9.5 0.5l-9 9"></path></svg></button>
    </div>
  </header>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 48px 20px 12px; display: flex; flex-direction: column; gap: 0px; background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.72) 35%, rgba(0,0,0,0.45) 60%, rgba(0,0,0,0.15) 85%, rgba(0,0,0,0) 100%)">
    <div style="position: relative; height: 32px; display: flex; align-items: center">
      <div style="position: relative; width: 100%; height: 6px; border-radius: 999px; background: rgba(255,255,255,0.28); box-shadow: 0 0 0 1px rgba(0,0,0,0.25)">
        <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 41%; border-radius: 999px; background: {{accent}}"></div>
      </div>
      <div style="position: absolute; left: 41%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 4px rgba(0,0,0,0.5)"></div>
      <input type="range" aria-label="Seek" aria-valuetext="18:06 of 44:10" min="0" max="2650" value="1086" style="position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0">
    </div>

    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin: 0 -14px 0 -16px">
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
        <div style="display: flex; align-items: center; gap: 4px">
          <button aria-label="Play" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #EDEBE7; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5.2v13.6a1 1 0 0 0 1.52.85l10.9-6.8a1 1 0 0 0 0-1.7L8.52 4.35A1 1 0 0 0 7 5.2z"></path></svg></button>
          <button aria-label="Back 10 seconds" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #EDEBE7; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><text x="12" y="15" text-anchor="middle" font-size="7" font-family="Geist, sans-serif" font-weight="600" fill="currentColor" stroke="none">10</text></svg></button>
          <button aria-label="Forward 10 seconds" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #EDEBE7; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><text x="12" y="15" text-anchor="middle" font-size="7" font-family="Geist, sans-serif" font-weight="600" fill="currentColor" stroke="none">10</text></svg></button>
        </div>
        <button aria-label="Elapsed time; click to show time remaining" style="height: 44px; padding: 0 6px; border: 0; border-radius: 10px; background: transparent; color: #EDEBE7; font-family: inherit; font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums">18:06 <span style="color: #CFCAC4">/ 44:10</span></button>
      </div>

      <div style="display: flex; align-items: center; gap: 4px">
        <div style="display: flex; align-items: center; gap: 4px; margin-right: 12px">
          <button aria-label="Mute" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #EDEBE7; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg></button>
          <div style="position: relative; width: 88px; height: 20px; display: flex; align-items: center">
            <div style="position: relative; width: 100%; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.28)">
              <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 70%; border-radius: 999px; background: #EDEBE7"></div>
            </div>
            <input type="range" aria-label="Volume" min="0" max="100" value="70" style="position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0">
          </div>
        </div>
        <button aria-label="Subtitles and audio" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #EDEBE7; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M7 11h3M13 11h4M7 15h6M15 15h2"></path></svg></button>
        <button aria-label="Playback speed, normal" style="min-width: 44px; height: 44px; padding: 0 8px; border: 0; border-radius: 10px; background: transparent; color: #EDEBE7; font-family: inherit; font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums">1×</button>
        <button aria-label="Enter fullscreen" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #EDEBE7; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"></path></svg></button>
      </div>
    </div>
  </div>

  <div role="menu" aria-label="Video options" style="position: absolute; left: 44%; top: 30%; width: 248px; box-sizing: border-box; padding: 6px; border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; background: rgba(26,25,23,0.92); box-shadow: 0 16px 40px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 2px">
    <button role="menuitem" style="display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 10px; border: 0; border-radius: 6px; background: rgba(255,255,255,0.06); color: #EDEBE7; font-family: inherit; font-size: 14px; text-align: left">Open file…<span style="font-size: 12px; color: #A8A29E">Ctrl O</span></button>
    <button role="menuitem" style="display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: #EDEBE7; font-family: inherit; font-size: 14px; text-align: left">Open URL…<span style="font-size: 12px; color: #A8A29E">Ctrl U</span></button>
    <div role="separator" style="height: 1px; margin: 4px; background: rgba(255,255,255,0.08)"></div>
    <button role="menuitemcheckbox" aria-checked="false" style="display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: #EDEBE7; font-family: inherit; font-size: 14px; text-align: left">Always on top<span style="font-size: 12px; color: #A8A29E">T</span></button>
    <button role="menuitem" aria-haspopup="menu" style="display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: #EDEBE7; font-family: inherit; font-size: 14px; text-align: left">Aspect ratio<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #A8A29E">Default<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span></button>
    <button role="menuitem" style="display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: #EDEBE7; font-family: inherit; font-size: 14px; text-align: left">Take screenshot<span style="font-size: 12px; color: #A8A29E">S</span></button>
    <div role="separator" style="height: 1px; margin: 4px; background: rgba(255,255,255,0.08)"></div>
    <button role="menuitem" style="display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: #EDEBE7; font-family: inherit; font-size: 14px; text-align: left">Show in Explorer</button>
    <button role="menuitem" style="display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: #EDEBE7; font-family: inherit; font-size: 14px; text-align: left">Keyboard shortcuts<span style="font-size: 12px; color: #A8A29E">?</span></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5A524","options":["#F5A524","#FF7A1A","#7DD3FC","#EDEBE7"]},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#F5A524' };
  }
}
</script>
</body>
</html>
