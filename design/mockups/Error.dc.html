<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BearMinVLC – Can't play this file</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0C0B0A}
a{color:#EDEBE7}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="height: 100vh; min-height: 560px; box-sizing: border-box; display: flex; flex-direction: column; background: #0C0B0A; color: #EDEBE7; font-family: 'Geist', system-ui, sans-serif">
  <header style="height: 32px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding-left: 20px">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="18" height="18" viewBox="0 0 32 32" aria-hidden="true"><path fill="{{accent}}" d="M16 8C17.27 8 18.43 8.07 19.51 8.2A4.5 4.5 0 1 1 27.13 11.73C28.39 13.31 29 15.39 29 18C29 24.8 24.84 28 16 28C7.16 28 3 24.8 3 18C3 15.39 3.61 13.31 4.87 11.73A4.5 4.5 0 1 1 12.49 8.2C13.57 8.07 14.73 8 16 8Z"></path><path fill="#0C0B0A" d="M13.49 12.34L21.96 17.13A1 1 0 0 1 21.96 18.87L13.49 23.66A1 1 0 0 1 12 22.79L12 13.21A1 1 0 0 1 13.49 12.34Z"></path></svg>
      <span style="font-size: 14px; font-weight: 500">Holiday 2009.avi</span>
    </div>
    <div style="display: flex">
      <button aria-label="Minimize" style="width: 46px; height: 32px; border: 0; border-radius: 0; background: transparent; color: #A8A29E; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M0 5.5h10"></path></svg></button>
      <button aria-label="Maximize" style="width: 46px; height: 32px; border: 0; border-radius: 0; background: transparent; color: #A8A29E; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><rect x="0.5" y="0.5" width="9" height="9" rx="1"></rect></svg></button>
      <button aria-label="Close" style="width: 46px; height: 32px; border: 0; border-radius: 0; background: transparent; color: #A8A29E; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M0.5 0.5l9 9M9.5 0.5l-9 9"></path></svg></button>
    </div>
  </header>

  <main role="alert" style="flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px 20px 64px; text-align: center">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#A8A29E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5"></path><path d="M12 16.5h.01"></path></svg>
    <h1 style="margin: 6px 0 0; font-size: 28px; font-weight: 600; letter-spacing: -0.02em">Can't play this file</h1>
    <p style="margin: 0; max-width: 420px; font-size: 15px; line-height: 1.5; color: #A8A29E">The file may be damaged or incomplete — playback stopped before the first frame. Other files still play normally.</p>
    <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 10px">
      <button style="height: 44px; padding: 0 22px; border: 0; border-radius: 999px; background: {{accent}}; color: #0C0B0A; font-family: inherit; font-size: 15px; font-weight: 500">Open another file</button>
      <button style="height: 44px; padding: 0 20px; border: 1px solid rgba(255,255,255,0.14); border-radius: 999px; background: transparent; color: #EDEBE7; font-family: inherit; font-size: 15px; font-weight: 500">Show in Explorer</button>
    </div>
    <button aria-expanded="false" style="height: 36px; margin-top: 4px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: #A8A29E; font-family: inherit; font-size: 12px; display: flex; align-items: center; gap: 6px">Technical details<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5A524","options":["#F5A524","#FF7A1A","#7DD3FC","#EDEBE7"]},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#F5A524' };
  }
}
</script>
</body>
</html>
